<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Topbar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header style="width: 100%; height: 60px; box-sizing: border-box; background: #FFFFFF; border-bottom: 1px solid #E6E8EC; display: flex; align-items: center; gap: 16px; padding: 0 24px; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #172033; flex-shrink: 0">
<nav aria-label="Breadcrumb" style="min-width: 260px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #667085">
<span>{{module}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
<span style="color: #172033; font-weight: 600">{{page}}</span>
</nav>
<div style="flex-grow: 1; display: flex; justify-content: center">
<label style="width: 420px; height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; background: #F8F9FA; border: 1px solid #E6E8EC; border-radius: 8px; color: #98A2B3">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg>
<input type="text" placeholder="Search anything..." aria-label="Search anything" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; outline: none; font: inherit; font-size: 13px; color: #172033">
<span style="font-size: 11px; font-weight: 600; color: #667085; background: #FFFFFF; border: 1px solid #E6E8EC; border-radius: 5px; padding: 2px 6px">Ctrl K</span>
</label>
</div>
<button aria-label="Notifications" style="position: relative; width: 36px; height: 36px; border: 0; background: transparent; color: #667085; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
<span style="position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 4px; background: #D71920; border: 1.5px solid #FFFFFF"></span>
</button>
<span style="width: 1px; height: 28px; background: #E6E8EC"></span>
<button style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 4px; cursor: pointer; font: inherit; color: #172033; text-align: left">
<span style="width: 32px; height: 32px; border-radius: 16px; background: #F5F6F8; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">AD</span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 13px; font-weight: 600">Administrator</span>
<span style="font-size: 11.5px; color: #98A2B3">Admin · Both firms</span>
</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#667085" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"module":{"editor":null,"default":"Home"},"page":{"editor":null,"default":"My work list"},"$preview":{"width":1208,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    return { module: this.props.module ?? 'Home', page: this.props.page ?? 'My work list' };
  }
}
</script>
</body>
</html>
