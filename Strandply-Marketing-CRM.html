<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Strandply LLP — Marketing &amp; Sales CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --red:#C8102E; --red2:#a00d24; --red3:#7d0a1d; --redlt:#fff0f2; --redmid:#ffd7dc;
  --off:#f4f6fa; --g0:#f8f9fb; --g1:#f1f3f7; --g2:#e4e8ef; --g3:#c5cdd8;
  --g4:#8a96a8; --g5:#4a5568; --g6:#1a202c; --border:#dde3ec;
  --green:#16a34a; --greenlt:#f0fdf4; --amber:#d97706; --amberlt:#fffbeb;
  --purple:#7c3aed; --purplelt:#f5f3ff; --teal:#0891b2; --teallt:#ecfeff;
  --danger:#dc2626; --dangerlt:#fee2e2;
  --fh: 'Inter', sans-serif; --fb:'Inter',sans-serif; --fm:'JetBrains Mono',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.08); --shadow2:0 4px 16px rgba(0,0,0,.12); --shadow3:0 8px 32px rgba(0,0,0,.16);
  --sidebar-w:250px; --topbar-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--off);color:var(--g6);font-family:var(--fb);font-size:13.5px;line-height:1.5;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--g3);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ===== APP SHELL ===== */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--red2);color:#fff;
  display:flex;align-items:center;gap:14px;padding:0 18px;z-index:300;box-shadow:var(--shadow2)}
#topbar .brand{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:800;letter-spacing:.5px}
#topbar .brand .mark{background:var(--red);width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
#topbar .brand .sub{font-family:var(--fm);font-size:10px;font-weight:400;color:rgba(255,255,255,.55);letter-spacing:1px}
#hamburger{display:none;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px}
#gsearch{flex:1;max-width:420px;margin-left:10px;position:relative}
#gsearch input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;
  border-radius:7px;padding:8px 12px 8px 34px;font-family:var(--fb);font-size:12.5px}
#gsearch input::placeholder{color:rgba(255,255,255,.5)}
#gsearch::before{content:'🔎';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6}
#gsearch-results{position:absolute;top:36px;left:0;right:0;background:#fff;border-radius:8px;box-shadow:var(--shadow3);
  color:var(--g6);max-height:360px;overflow:auto;display:none;z-index:400}
#gsearch-results .gr-item{padding:9px 14px;border-bottom:1px solid var(--g1);cursor:pointer;font-size:12.5px}
#gsearch-results .gr-item:hover{background:var(--redlt)}
#gsearch-results .gr-item .gr-tag{font-family:var(--fm);font-size:9px;color:var(--red);text-transform:uppercase;letter-spacing:1px;margin-right:6px}
#topbar-right{display:flex;align-items:center;gap:14px;margin-left:auto}
#role-switch{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:6px;padding:6px 10px;font-family:var(--fm);font-size:11px}
#role-switch option{color:#000}
#notif-btn{position:relative;background:none;border:none;color:#fff;font-size:17px;cursor:pointer;padding:4px}
#notif-dot{position:absolute;top:0;right:0;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--g6)}
#today-pill{font-family:var(--fm);font-size:11px;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:6px}

#sidebar{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--sidebar-w);background:var(--red);
  overflow-y:auto;z-index:250;transition:transform .25s ease}
#sidebar .sb-group{padding:14px 16px 4px;font-family:var(--fm);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.45)}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-family:var(--fb);font-size:13px;font-weight:500;
  color:rgba(255,255,255,.78);cursor:pointer;border-left:3px solid transparent;user-select:none}
.sb-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sb-item.active{background:rgba(255,255,255,.16);color:#fff;border-left-color:#fff;font-weight:700}
.sb-item .ico{width:18px;text-align:center}
.sb-badge{margin-left:auto;background:#fff;color:var(--red);font-family:var(--fm);font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px}

#content{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:22px;min-height:calc(100vh - var(--topbar-h))}
.page{display:none;animation:fadeIn .2s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.page-title{font-family:var(--fh);font-size:24px;font-weight:800;color:var(--g6)}
.page-sub{font-family:var(--fm);font-size:11.5px;color:var(--g4);margin-top:3px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Components ===== */
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-family:var(--fh);font-size:12.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g4);
  margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--g1);display:flex;justify-content:space-between;align-items:center}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:#fff;border-radius:8px;padding:16px 18px;border-top:3px solid var(--red);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.kpi-lbl{font-family:var(--fm);font-size:9.5px;color:var(--g4);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.kpi-val{font-family:var(--fh);font-size:24px;font-weight:800;color:var(--g6)}
.kpi-sub{font-size:10.5px;color:var(--g4);margin-top:3px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:5px;border:none;font-family:var(--fh);
  font-size:12.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{filter:brightness(.94)}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn-gray{background:var(--g1);color:var(--g5);border:1px solid var(--g2)}
.btn-green{background:var(--green);color:#fff}
.btn-teal{background:var(--teal);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-sm{padding:5px 11px;font-size:10.5px}
.btn-xs{padding:3px 8px;font-size:9.5px;border-radius:4px}
.btn-icon{padding:6px 9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.tag{display:inline-block;font-size:9px;font-family:var(--fm);padding:2px 8px;border-radius:3px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;white-space:nowrap}
.tag-red{background:var(--redlt);color:var(--red);border:1px solid var(--redmid)}
.tag-green{background:var(--greenlt);color:var(--green);border:1px solid #bbf7d0}
.tag-amber{background:var(--amberlt);color:var(--amber);border:1px solid #fde68a}
.tag-teal{background:var(--teallt);color:var(--teal);border:1px solid #a5f3fc}
.tag-purple{background:var(--purplelt);color:var(--purple);border:1px solid #ddd6fe}
.tag-gray{background:var(--g1);color:var(--g5);border:1px solid var(--g2)}
.tag-danger{background:var(--dangerlt);color:var(--danger);border:1px solid #fecaca}

.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
table.dt th{background:var(--red);color:#fff;font-family:var(--fh);font-size:10px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;padding:10px 12px;text-align:left;white-space:nowrap;position:sticky;top:0}
table.dt td{padding:9px 12px;border-bottom:1px solid var(--g1);vertical-align:middle;white-space:nowrap}
table.dt tr:hover td{background:var(--redlt)}
table.dt tr:last-child td{border-bottom:none}
.mono{font-family:var(--fm)}
.txt-red{color:var(--red)}
.txt-green{color:var(--green)}
.txt-amber{color:var(--amber)}
.txt-muted{color:var(--g4)}
.txt-b{font-weight:700}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=text],.toolbar input[type=search],.toolbar select,.toolbar input[type=date]{
  padding:7px 10px;border:1px solid var(--g3);border-radius:5px;font-size:12px;background:#fff;color:var(--g6)}
.toolbar input[type=text]{min-width:200px}
.empty-state{text-align:center;padding:40px 20px;color:var(--g4);font-family:var(--fm);font-size:12px}

/* Forms */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.ffull{grid-column:1/-1}
.fld label{display:block;font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  color:var(--g4);margin-bottom:5px}
.fld label .req{color:var(--red)}
.finput{width:100%;background:#fff;border:1px solid var(--g3);border-radius:5px;padding:8px 11px;font-family:var(--fb);font-size:13px;color:var(--g6)}
.finput:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(200,16,46,.08)}
textarea.finput{resize:vertical;min-height:60px}
.fsection{grid-column:1/-1;font-family:var(--fh);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--g4);margin:6px 0 -2px;padding-left:10px;border-left:4px solid var(--red)}
.fld{position:relative}
.ac-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:6px;
  box-shadow:var(--shadow2);max-height:190px;overflow-y:auto;z-index:950;display:none;margin-top:2px}
.ac-dropdown.open{display:block}
.ac-item{padding:7px 11px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--g1)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover, .ac-item.hi{background:var(--redlt);color:var(--red)}

/* Modal */
#modal-overlay{position:fixed;inset:0;background:rgba(26,32,44,.5);z-index:900;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
#modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:10px;box-shadow:var(--shadow3);width:100%;max-width:720px;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.modal-hd{background:var(--red);color:#fff;padding:14px 20px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal-hd h3{font-family:var(--fh);font-size:16px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.modal-hd button{background:rgba(255,255,255,.15);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px}
.modal-body{padding:20px;max-height:70vh;overflow-y:auto}
.modal-ft{padding:14px 20px;border-top:1px solid var(--g1);display:flex;justify-content:flex-end;gap:8px}

/* Timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--g2)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item::before{content:'';position:absolute;left:-26px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 0 0 2px var(--red)}
.tl-date{font-family:var(--fm);font-size:10.5px;color:var(--g4)}
.tl-type{display:inline-block;margin:2px 0 4px}
.tl-text{font-size:12.5px;color:var(--g6)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--g1);margin-bottom:16px;flex-wrap:wrap}
.tab-btn{padding:9px 16px;font-family:var(--fh);font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--g4);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:var(--red);border-bottom-color:var(--red)}
.tabpane{display:none}
.tabpane.active{display:block}

/* Kanban / pipeline */
.pipeline{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.pl-col{min-width:220px;background:var(--g0);border-radius:8px;border:1px solid var(--border);flex-shrink:0}
.pl-col-hd{padding:10px 12px;font-family:var(--fh);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#fff;background:var(--g5);border-radius:8px 8px 0 0;display:flex;justify-content:space-between}
.pl-card{background:#fff;border:1px solid var(--border);border-radius:7px;padding:10px;margin:8px;box-shadow:var(--shadow);cursor:pointer}
.pl-card:hover{box-shadow:var(--shadow2)}
.pl-card .pc-name{font-weight:700;font-size:12.5px;margin-bottom:3px}
.pl-card .pc-meta{font-family:var(--fm);font-size:10px;color:var(--g4)}

.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}.fgrid,.fgrid3{grid-template-columns:1fr}}
@media (max-width:768px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #content{margin-left:0}
  #hamburger{display:block}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
}
.priority-hot{color:var(--red);font-weight:700}
.priority-warm{color:var(--amber);font-weight:700}
.priority-cold{color:var(--teal);font-weight:700}
.badge-count{background:var(--red);color:#fff;font-family:var(--fm);font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:6px}
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--g6);color:#fff;padding:11px 18px;border-radius:7px;font-size:12.5px;box-shadow:var(--shadow3);animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:190px}
a.linklike{color:var(--red);cursor:pointer;font-weight:600;text-decoration:none}
a.linklike:hover{text-decoration:underline}
@media print{
  #topbar,#sidebar,.page-actions,.toolbar,.no-print{display:none!important}
  #content{margin:0;padding:0}
  body{background:#fff}
}
</style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div id="topbar">
  <button id="hamburger">☰</button>
  <div class="brand"><img src="strandply-icon.png" alt="Strandply" style="width:28px;height:28px;object-fit:contain;"><div><div>STRANDPLY CRM</div><div class="sub">Marketing &amp; Sales · v1.0</div></div></div>
  <div id="gsearch"><input id="gsearch-input" type="text" placeholder="Search customer, mobile, city, GST, product…">
    <div id="gsearch-results"></div>
  </div>
  <div id="topbar-right">
    <span id="today-pill"></span>
    <select id="role-switch">
      <option value="Admin">Admin</option>
      <option value="Management">Management</option>
      <option value="Sales Manager">Sales Manager</option>
      <option value="Salesperson">Salesperson</option>
      <option value="Marketing">Marketing</option>
      <option value="Data Entry">Data Entry</option>
    </select>
    <button id="notif-btn">🔔<span id="notif-dot" style="display:none"></span></button>
  </div>
</div>

<div id="sidebar"></div>
<div id="content"></div>
<div id="modal-overlay"><div class="modal" id="modal-box"></div></div>
<div id="toast-wrap"></div>

<script>
/* ============================================================
   STRANDPLY CRM — core: DOM helper, storage layer, utilities
============================================================ */
'use strict';

function h(tag, attrs, ...children){
  attrs = attrs || {};
  const e = document.createElement(tag);
  for(const k in attrs){
    const v = attrs[k];
    if(v==null) continue;
    if(k==='class') e.className = v;
    else if(k==='style' && typeof v==='object'){ Object.assign(e.style, v); }
    else if(k.indexOf('on')===0 && typeof v==='function'){ e.addEventListener(k.slice(2).toLowerCase(), v); }
    else if(k==='checked' || k==='disabled' || k==='selected'){ if(v) e.setAttribute(k,''); e[k]=v; }
    else e.setAttribute(k, v);
  }
  children.flat(Infinity).forEach(c=>{
    if(c==null || c===false) return;
    if(typeof c==='string' || typeof c==='number') e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  });
  return e;
}
function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

/* ---- storage ---- */
const DB = {
  _k(name){ return 'spl_crm_' + name; },
  get(name){ try{ const raw = localStorage.getItem(this._k(name)); return raw ? JSON.parse(raw) : []; }catch(e){ return []; } },
  set(name, arr){ localStorage.setItem(this._k(name), JSON.stringify(arr)); },
  add(name, obj){ const arr = this.get(name); arr.push(obj); this.set(name, arr); return obj; },
  update(name, id, patch){ const arr = this.get(name); const i = arr.findIndex(x=>x.id===id); if(i>-1){ arr[i] = Object.assign({}, arr[i], patch); this.set(name, arr);} return arr[i]; },
  remove(name, id){ const arr = this.get(name).filter(x=>x.id!==id); this.set(name, arr); },
  byId(name, id){ return this.get(name).find(x=>x.id===id); }
};

let SEQ = (function(){ try{ return JSON.parse(localStorage.getItem('spl_crm_seq')||'{}'); }catch(e){ return {}; } })();
function saveSeq(){ localStorage.setItem('spl_crm_seq', JSON.stringify(SEQ)); }
function fy(){ // financial year suffix e.g. 26-27
  const d = new Date(); const y = d.getMonth()>=3 ? d.getFullYear() : d.getFullYear()-1;
  return String(y).slice(2) + '-' + String(y+1).slice(2);
}
function nextId(prefix){
  const key = prefix + '_' + fy();
  SEQ[key] = (SEQ[key]||0) + 1; saveSeq();
  return prefix + '/' + fy() + '/' + String(SEQ[key]).padStart(4,'0');
}
function uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---- date helpers ---- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function toDisp(iso){ if(!iso) return '—'; const p = iso.split('-'); if(p.length!==3) return iso; return p[2]+'-'+p[1]+'-'+p[0]; }
function daysBetween(a,b){ const A=new Date(a), B=new Date(b); return Math.round((B-A)/86400000); }
function fmtMoney(n, forPrint){ n = Number(n)||0; const s = n.toLocaleString('en-IN', {maximumFractionDigits:0}); return (forPrint?'Rs. ':'₹') + s; }
function esc(s){ return (s==null?'':String(s)); }

function toast(msg){
  const t = h('div', {class:'toast'}, msg);
  $('#toast-wrap').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}

function confirmAction(msg, onYes){
  openModal('CONFIRM', [], null, {custom: h('div', {}, h('p',{style:{marginBottom:'16px',fontSize:'13px'}}, msg))}, [
    {label:'Cancel', cls:'btn-gray', action: closeModal},
    {label:'Confirm', cls:'btn-red', action: ()=>{ closeModal(); onYes(); }}
  ]);
}

/* ---- modal engine ---- */
function closeModal(){ $('#modal-overlay').classList.remove('open'); clear($('#modal-box')); }
function openModal(title, fields, onSave, opts, footerButtons){
  opts = opts || {};
  const box = $('#modal-box'); clear(box);
  const body = h('div', {class:'modal-body'});
  const inputs = {};
  if(opts.custom){ body.appendChild(opts.custom); }
  else {
    const grid = h('div', {class: opts.grid3 ? 'fgrid3' : 'fgrid'});
    fields.forEach(f=>{
      if(f.type==='section'){ grid.appendChild(h('div',{class:'fsection'}, f.label)); return; }
      const wrap = h('div', {class:'fld' + (f.full?' ffull':'')});
      wrap.appendChild(h('label',{}, f.label, f.required?h('span',{class:'req'},' *'):null));
      let input;
      if(f.type==='select'){
        input = h('select', {class:'finput'});
        (f.options||[]).forEach(o=>{
          const val = typeof o==='object'?o.value:o, lbl = typeof o==='object'?o.label:o;
          input.appendChild(h('option',{value:val}, lbl));
        });
      } else if(f.type==='textarea'){
        input = h('textarea', {class:'finput', rows:f.rows||3});
      } else {
        input = h('input', {class:'finput', type:f.type||'text', step:f.step||null, placeholder:f.placeholder||''});
      }
      if(f.value!=null) input.value = f.value;
      inputs[f.key] = input;
      wrap.appendChild(input);
      if(f.key==='city') attachCityAutocomplete(wrap, input);
      grid.appendChild(wrap);
    });
    body.appendChild(grid);
    // Auto-fill State from City, wherever a form has both fields
    if(inputs.city && inputs.state){
      const fillState = ()=>{
        const st = lookupState(inputs.city.value);
        if(st) inputs.state.value = st;
      };
      inputs.city.addEventListener('blur', fillState);
      inputs.city.addEventListener('change', fillState);
    }
  }
  const hd = h('div', {class:'modal-hd'}, h('h3',{}, title), h('button', {onClick:closeModal}, '✕'));
  const ft = h('div', {class:'modal-ft'});
  if(footerButtons){
    footerButtons.forEach(b=> ft.appendChild(h('button', {class:'btn '+b.cls, onClick:b.action}, b.label)));
  } else {
    ft.appendChild(h('button',{class:'btn btn-gray', onClick:closeModal},'Cancel'));
    ft.appendChild(h('button',{class:'btn btn-red', onClick:()=>{
      const data = {}; for(const k in inputs) data[k] = inputs[k].value;
      if(onSave(data)!==false) closeModal();
    }}, 'Save'));
  }
  box.appendChild(hd); box.appendChild(body); box.appendChild(ft);
  $('#modal-overlay').classList.add('open');
}

/* ---- generic table renderer ---- */
function renderTable(container, columns, rows, opts){
  opts = opts || {};
  clear(container);
  if(!rows.length){ container.appendChild(h('div',{class:'empty-state'}, opts.emptyText || 'No records found.')); return; }
  const wrap = h('div',{class:'table-wrap'});
  const table = h('table',{class:'dt'});
  const thead = h('thead',{}, h('tr',{}, columns.map(c=>h('th',{}, c.label))));
  const tbody = h('tbody');
  rows.forEach(r=>{
    const tr = h('tr');
    columns.forEach(c=>{
      const td = h('td', c.mono?{class:'mono'}:{});
      const val = c.render ? c.render(r) : (r[c.key]==null?'—':r[c.key]);
      if(val instanceof Node) td.appendChild(val); else td.appendChild(document.createTextNode(val===''?'—':val));
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(thead); table.appendChild(tbody); wrap.appendChild(table); container.appendChild(wrap);
}

function lookupState(city){
  if(!city) return '';
  const key = city.trim().toLowerCase();
  return CITY_STATE_MAP[key] || '';
}
function titleCase(s){ return s.replace(/\w\S*/g, t=> t.charAt(0).toUpperCase()+t.substr(1).toLowerCase()); }
function allKnownCities(){
  const set = new Set();
  Object.keys(CITY_STATE_MAP).forEach(k=> set.add(titleCase(k)));
  ['customers','leads'].forEach(store=>{
    DB.get(store).forEach(r=>{ if(r.city) set.add(r.city.trim()); });
  });
  return Array.from(set).sort();
}
function attachCityAutocomplete(wrapEl, inputEl){
  const dd = h('div',{class:'ac-dropdown'});
  wrapEl.appendChild(dd);
  function renderList(){
    const q = inputEl.value.trim().toLowerCase();
    clear(dd);
    if(!q){ dd.classList.remove('open'); return; }
    const matches = allKnownCities().filter(c=>c.toLowerCase().includes(q)).slice(0,8);
    if(!matches.length){ dd.classList.remove('open'); return; }
    matches.forEach(c=>{
      dd.appendChild(h('div',{class:'ac-item', onMousedown:(e)=>{
        e.preventDefault();
        inputEl.value = c;
        inputEl.dispatchEvent(new Event('change'));
        dd.classList.remove('open');
      }}, c));
    });
    dd.classList.add('open');
  }
  inputEl.addEventListener('input', renderList);
  inputEl.addEventListener('focus', renderList);
  inputEl.addEventListener('blur', ()=> setTimeout(()=>dd.classList.remove('open'), 120));
}

============================================================ */
function followupBuckets(){
  const fus = DB.get('followups').filter(f=>f.status==='Pending' || f.status==='Rescheduled');
  const today = todayISO();
  const buckets = {overdue:[], today:[], tomorrow:[], upcoming:[]};
  const tmrw = new Date(); tmrw.setDate(tmrw.getDate()+1); const tmrwISO = tmrw.toISOString().slice(0,10);
  fus.forEach(f=>{
    const d = f.nextFollowUpDate || f.date;
    if(!d) return;
    if(d < today) buckets.overdue.push(f);
    else if(d === today) buckets.today.push(f);
    else if(d === tmrwISO) buckets.tomorrow.push(f);
    else buckets.upcoming.push(f);
  });
  return buckets;
}
function refreshNotifDot(){
  const b = followupBuckets();
  $('#notif-dot').style.display = (b.overdue.length + b.today.length) ? 'block' : 'none';
}

function mkCanvas(box){ const cv = h('canvas'); box.appendChild(cv); return cv; }

function findDuplicateLeadOrCustomer(rec){
  const leads = DB.get('leads'), custs = DB.get('customers');
  const hit = [];
  leads.forEach(l=>{
    if(rec.mobile && l.mobile===rec.mobile) hit.push('lead mobile match: '+l.companyName);
    else if(rec.companyName && rec.city && l.companyName===rec.companyName && l.city===rec.city) hit.push('lead company+city match: '+l.companyName);
    else if(rec.email && l.email===rec.email) hit.push('lead email match: '+l.companyName);
  });
  custs.forEach(cu=>{
    if(rec.mobile && cu.mobile===rec.mobile) hit.push('customer mobile match: '+cu.companyName);
    else if(rec.companyName && rec.city && cu.companyName===rec.companyName && cu.city===rec.city) hit.push('customer company+city match: '+cu.companyName);
  });
  return hit;
}

function openLeadModal(id){
  const existing = id ? DB.byId('leads', id) : null;
  openModal(existing?'Edit Lead':'Add New Lead', leadFieldDefs(existing), (data)=>{
    if(!data.companyName || !data.mobile){ toast('Company name and mobile are required'); return false; }
    if(!existing){
      const dupes = findDuplicateLeadOrCustomer(data);
      if(dupes.length){
        // proceed but warn
        toast('⚠ Possible duplicate: ' + dupes[0]);
      }
      const rec = Object.assign({id:uid(), dateAdded: todayISO(), status:'New Lead', lastContactDate:'', dataQuality:'Good', customerId:null}, data);
      DB.add('leads', rec);

function convertToCustomer(leadId){
  const lead = DB.byId('leads', leadId);
  if(!lead) return;
  if(lead.customerId){ navigate('customers'); return; }
  const cust = {
    id: uid(), companyName: lead.companyName, contactPerson: lead.contactPerson, designation:'', mobile: lead.mobile,
    whatsapp: lead.whatsapp, email: lead.email, website:'', address: lead.address, city: lead.city, state: lead.state,
    pincode: lead.pincode, gst:'', pan:'', customerType: lead.customerType, estMonthlyReq:'', productsUsed: lead.productInterested,
    currentSupplier:'', approxPurchaseValue:'', preferredThickness:'', preferredSize:'', application:'', existingBrand:'',
    competitorBrand:'', paymentPreference:'', creditRequirement:'', territory: lead.state||'', leadSource: lead.source,
    firstContactDate: lead.dateAdded, lastContactDate: todayISO(), nextFollowUp: lead.nextFollowUpDate, salesperson: lead.salesperson,
    status:'Active', priority:'Warm', rating:'', createdAt: todayISO()
  };
  DB.add('customers', cust);
  DB.update('leads', leadId, {customerId: cust.id, status: lead.status==='New Lead'?'Contacted':lead.status});
  logAudit('Lead converted to customer', 'customer', cust.id, '', cust.companyName);
  toast('Converted to Customer: ' + cust.companyName);
  render();
}

function handleImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const wb = XLSX.read(ev.target.result, {type:'binary'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(ws, {defval:''});
    showImportPreview(json);
  };
  reader.readAsBinaryString(file);
  e.target.value = '';
}

function showImportPreview(rows){
  const norm = rows.map(r=>{
    const get = (...keys)=>{ for(const k of keys){ for(const rk in r){ if(rk.toLowerCase().replace(/[^a-z]/g,'')===k) return r[rk]; } } return ''; };
    return {
      companyName: get('companyname','company','partyname','name'),
      contactPerson: get('contactperson','contact'),
      mobile: String(get('mobilenumber','mobile','phone')),
      email: get('email'),
      city: get('city'),
      state: get('state'),
      customerType: get('customertype','type') || 'Other',
      productInterested: get('productinterestedin','product') ,
      source: get('source') || 'Other',
      salesperson: get('salesperson'),
      remarks: get('remarks'),
    };
  }).filter(r=>r.companyName || r.mobile);

  let dupCount = 0;
  norm.forEach(r=> { if(findDuplicateLeadOrCustomer(r).length) dupCount++; });

  const body = h('div', {},
    h('p',{style:{marginBottom:'10px',fontSize:'12.5px'}},
      'Total Records: ' + rows.length + '  ·  Valid: ' + norm.length + '  ·  Possible Duplicates: ' + dupCount),
    h('div',{style:{maxHeight:'320px', overflow:'auto', border:'1px solid var(--g1)', borderRadius:'6px'}})
  );
  const tblHolder = body.children[1];
  renderTable(tblHolder, [
    {label:'Company', key:'companyName'}, {label:'Contact', key:'contactPerson'}, {label:'Mobile', key:'mobile', mono:true},
    {label:'City', key:'city'}, {label:'Source', key:'source'},
    {label:'Dup?', render:r=> findDuplicateLeadOrCustomer(r).length ? h('span',{class:'tag tag-amber'},'DUPLICATE') : h('span',{class:'tag tag-green'},'NEW')}
  ], norm.slice(0,200));

  openModal('Import Preview', [], null, {custom: body}, [
    {label:'Cancel', cls:'btn-gray', action: closeModal},
    {label:'Import ' + norm.length + ' Records', cls:'btn-red', action: ()=>{
      let imported=0;
      norm.forEach(r=>{
        const rec = Object.assign({id:uid(), dateAdded: todayISO(), status:'New Lead', lastContactDate:'', nextFollowUpDate:'', dataQuality:'Imported', customerId:null, altMobile:'', whatsapp:'', address:'', pincode:'', campaign:''}, r);
        DB.add('leads', rec); imported++;
      });
      logAudit('Bulk import', 'lead', '-', '', imported + ' records imported');
      toast(imported + ' leads imported');
      closeModal(); navigate('rawleads');
    }}
  ]);
}

    renderTable(lostC, [{label:'Product',key:'product'},{label:'Est. Value',render:r=>fmtMoney(r.estValue)},{label:'Reason',key:'lostReason'},{label:'Date',render:r=>toDisp(r.lostDate)}],
      DB.get('ordersLost').filter(o=>o.customerId===custId), {emptyText:'None yet.'});
    panes.appendChild(wrap);
  }
  function drawTimeline(){
    const events = [];
    DB.get('followups').filter(f=>f.customerId===custId).forEach(f=> events.push({date:f.date, type:f.type, text:f.discussion||f.nextAction||'Follow-up logged'}));
    DB.get('quotations').filter(q=>q.customerId===custId).forEach(q=> events.push({date:q.date, type:'QUOTATION', text:'Quotation '+q.id+' — '+fmtMoney(q.finalValue)}));
    DB.get('ordersWon').filter(o=>o.customerId===custId).forEach(o=> events.push({date:o.orderDate, type:'ORDER WON', text:o.quantity+' '+o.product}));
    DB.get('ordersLost').filter(o=>o.customerId===custId).forEach(o=> events.push({date:o.lostDate, type:'ORDER LOST', text:o.lostReason}));
    events.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const tl = h('div',{class:'tl'});
    if(!events.length) tl.appendChild(h('div',{class:'empty-state'},'No activity recorded yet.'));
    events.forEach(ev=>{
      tl.appendChild(h('div',{class:'tl-item'},
        h('div',{class:'tl-date'}, toDisp(ev.date)),
        h('div',{class:'tl-type'}, statusTag(ev.type)),
        h('div',{class:'tl-text'}, ev.text)));
    });
    panes.appendChild(tl);
  }
  switchTab('overview');
  g2.appendChild(left);

  const right = h('div');
  const scoreCard = h('div',{class:'card'});
  scoreCard.appendChild(h('div',{class:'card-title'},'Lead Score'));
  scoreCard.appendChild(priorityTag(cu.priority||'Warm'));
  scoreCard.appendChild(h('div',{style:{marginTop:'10px'}}, statusTag(cu.status)));
  right.appendChild(scoreCard);

  const nextCard = h('div',{class:'card'});
  nextCard.appendChild(h('div',{class:'card-title'},'Next Action'));
  nextCard.appendChild(h('div',{style:{fontSize:'13px'}}, cu.nextFollowUp ? ('Follow up on ' + toDisp(cu.nextFollowUp)) : 'No next follow-up scheduled'));
  right.appendChild(nextCard);
  g2.appendChild(right);
  c.appendChild(g2);
}

function openLeadStageModal(lead){
  openModal('Move Stage — ' + lead.companyName, [
    {key:'status', label:'Current Stage', type:'select', options:LEAD_STAGES, value:lead.status},
    {key:'nextAction', label:'Next Action', value:lead.nextAction||''},
    {key:'nextFollowUpDate', label:'Next Follow-Up Date', type:'date', value:lead.nextFollowUpDate||''},
    {key:'remarks', label:'Remarks', full:true, type:'textarea', value:lead.remarks||''},

   FOLLOW-UP MANAGEMENT — Today's Follow-Ups screen
============================================================ */
RENDERERS.followups = function(c){
  pageHead(c, "Follow-Up Management", 'Daily action screen and full follow-up history report', [
    h('button',{class:'btn btn-red', onClick:()=>quickFollowupPicker()}, '＋ Quick Follow-Up Entry'),
  ]);

  const tabs = h('div',{class:'tabs'});
  const panes = h('div');
  const tabDefs = [
    {id:'today', label:"Today's Follow-Ups"},
    {id:'report', label:'Follow-Up Report'},
  ];
  tabDefs.forEach((t,i)=> tabs.appendChild(h('button',{class:'tab-btn'+(i===0?' active':''), onClick:()=>switchFuTab(t.id)}, t.label)));
  c.appendChild(tabs); c.appendChild(panes);

  function switchFuTab(id){
    $all('.tab-btn', tabs).forEach((b,i)=>b.classList.toggle('active', tabDefs[i].id===id));
    clear(panes);
    if(id==='today') drawTodayScreen(panes); else drawFollowupReport(panes);
  }

  function drawTodayScreen(cont){
    const buckets = followupBuckets();
    const sections = [
      {title:'🔴 Overdue', data:buckets.overdue, cls:'txt-red'},
      {title:'🟢 Today', data:buckets.today},
      {title:'🟡 Tomorrow', data:buckets.tomorrow},
      {title:'Upcoming', data:buckets.upcoming},
    ];
    sections.forEach(sec=>{
      const card = h('div',{class:'card'});
      card.appendChild(h('div',{class:'card-title'}, sec.title, h('span',{class:'badge-count'}, sec.data.length)));
      const tblc = h('div'); card.appendChild(tblc);
      renderTable(tblc, [
        {label:'Customer', render:r=>{ const cu=DB.byId('customers',r.customerId); return h('a',{class:'linklike', onClick:()=>{CUSTOMER_VIEW_ID=r.customerId; navigate('customers');}}, cu?cu.companyName:(r.contactPerson||'—')); }},
        {label:'Contact', key:'contactPerson'},
        {label:'City', render:r=>{ const cu=DB.byId('customers',r.customerId); return cu?cu.city:''; }},
        {label:'Salesperson', key:'salesperson'},
        {label:'Last Discussion', key:'discussion'},
        {label:'Next Action', key:'nextAction'},
        {label:'Due', render:r=>toDisp(r.nextFollowUpDate||r.date)},
        {label:'Priority', render:r=>priorityTag(r.priority||'Warm')},
        {label:'Status', render:r=>statusTag(r.status)},
        {label:'Actions', render:r=> h('div',{style:{display:'flex',gap:'4px'}},
          h('button',{class:'btn btn-teal btn-xs', onClick:()=>callAction(r)}, '📞'),
          h('button',{class:'btn btn-green btn-xs', onClick:()=>waAction(r)}, '💬'),
          h('button',{class:'btn btn-outline btn-xs', onClick:()=>noteAction(r)}, 'Note'),
          h('button',{class:'btn btn-gray btn-xs', onClick:()=>rescheduleAction(r)}, 'Resched.'),
          h('button',{class:'btn btn-red btn-xs', onClick:()=>completeAction(r)}, 'Complete'),
        )},
      ], sec.data, {emptyText:'Nothing here.'});
      cont.appendChild(card);
    });
  }

  function drawFollowupReport(cont){
    const custs = DB.get('customers');
    const toolbar = h('div',{class:'toolbar'});
    const dFrom = h('input',{type:'date'});
    const dTo = h('input',{type:'date'});
    const cityF = h('select'); cityF.appendChild(h('option',{value:''},'All Cities'));
    Array.from(new Set(custs.map(cu=>cu.city).filter(Boolean))).sort().forEach(ct=>cityF.appendChild(h('option',{value:ct},ct)));
    const spF = h('select'); spF.appendChild(h('option',{value:''},'All Salespersons'));
    salespersonNames().forEach(s=>spF.appendChild(h('option',{value:s},s)));
    const typeF = h('select'); typeF.appendChild(h('option',{value:''},'All Types'));
    FOLLOWUP_TYPES.forEach(t=>typeF.appendChild(h('option',{value:t},t)));
    const statusF = h('select'); statusF.appendChild(h('option',{value:''},'All Statuses'));
    FOLLOWUP_STATUSES.forEach(s=>statusF.appendChild(h('option',{value:s},s)));
    toolbar.appendChild(h('div',{class:'fld',style:{minWidth:'0'}}, h('label',{},'From'), dFrom));
    toolbar.appendChild(h('div',{class:'fld',style:{minWidth:'0'}}, h('label',{},'To'), dTo));
    toolbar.appendChild(cityF); toolbar.appendChild(spF); toolbar.appendChild(typeF); toolbar.appendChild(statusF);
    toolbar.appendChild(h('button',{class:'btn btn-gray btn-sm', onClick:()=>exportExcel('followup_report.xlsx', filtered().map(exportRow))}, '⬇ Export'));
    cont.appendChild(toolbar);

    const chartsRow = h('div',{class:'grid2'});
    const chartCard1 = h('div',{class:'card'}); chartCard1.appendChild(h('div',{class:'card-title'},'Follow-Ups by Type'));
    const box1 = h('div',{class:'chart-box sm'}); chartCard1.appendChild(box1);
    const chartCard2 = h('div',{class:'card'}); chartCard2.appendChild(h('div',{class:'card-title'},'Follow-Ups Trend (by date)'));
    const box2 = h('div',{class:'chart-box sm'}); chartCard2.appendChild(box2);
    chartsRow.appendChild(chartCard1); chartsRow.appendChild(chartCard2);
    cont.appendChild(chartsRow);

    const tblCard = h('div',{class:'card'});
    tblCard.appendChild(h('div',{class:'card-title'}, 'Follow-Up Details', h('span',{class:'badge-count'}, '0')));
    const tblc = h('div'); tblCard.appendChild(tblc);
    cont.appendChild(tblCard);

    function filtered(){
      let rows = DB.get('followups');
      if(dFrom.value) rows = rows.filter(f=>(f.date||'') >= dFrom.value);
      if(dTo.value) rows = rows.filter(f=>(f.date||'') <= dTo.value);
      if(cityF.value) rows = rows.filter(f=>{ const cu=DB.byId('customers',f.customerId); return cu && cu.city===cityF.value; });
      if(spF.value) rows = rows.filter(f=>f.salesperson===spF.value);
      if(typeF.value) rows = rows.filter(f=>f.type===typeF.value);
      if(statusF.value) rows = rows.filter(f=>f.status===statusF.value);
      return rows.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    }
    function exportRow(f){
      const cu = DB.byId('customers', f.customerId) || {};
      return {ID:f.id, PartyName:cu.companyName||'', City:cu.city||'', Date:toDisp(f.date), Type:f.type,
        Comments:f.discussion||'', NextAction:f.nextAction||'', NextFollowUp:toDisp(f.nextFollowUpDate), Status:f.status};
    }
    let chart1, chart2;
    function draw(){
      const rows = filtered();
      $('.badge-count', tblCard).textContent = rows.length;
      renderTable(tblc, [
        {label:'ID', key:'id', mono:true},
        {label:'Party Name', render:r=>{ const cu=DB.byId('customers',r.customerId); return h('a',{class:'linklike', onClick:()=>{CUSTOMER_VIEW_ID=r.customerId; navigate('customers');}}, cu?cu.companyName:(r.contactPerson||'—')); }},
        {label:'City', render:r=>{ const cu=DB.byId('customers',r.customerId); return cu?cu.city:'—'; }},
        {label:'Date', render:r=>toDisp(r.date)},
        {label:'Type', key:'type'},
        {label:'Comments', key:'discussion'},
        {label:'Next Action', key:'nextAction'},
        {label:'Status', render:r=>statusTag(r.status)},
      ], rows, {emptyText:'No follow-ups match this filter.'});

      const typeAgg = {}; rows.forEach(r=>{ const t=r.type||'Other'; typeAgg[t]=(typeAgg[t]||0)+1; });
      const tl = Object.keys(typeAgg);
      if(chart1) chart1.destroy();
      clear(box1);
      if(tl.length) chart1 = new Chart(mkCanvas(box1), {type:'bar', data:{labels:tl, datasets:[{label:'Follow-ups', data:tl.map(k=>typeAgg[k]), backgroundColor:'#C8102E'}]}, options:baseChartOpts({})});
      else box1.appendChild(h('div',{class:'empty-state'},'No data'));

      const dateAgg = {}; rows.forEach(r=>{ const d=r.date||'Unknown'; dateAgg[d]=(dateAgg[d]||0)+1; });
      const dl = Object.keys(dateAgg).sort();
      if(chart2) chart2.destroy();
      clear(box2);
      if(dl.length) chart2 = new Chart(mkCanvas(box2), {type:'line', data:{labels:dl.map(toDisp), datasets:[{label:'Follow-ups', data:dl.map(k=>dateAgg[k]), borderColor:'#0891b2', backgroundColor:'rgba(8,145,178,.15)', tension:.25, fill:true}]}, options:baseChartOpts({})});
      else box2.appendChild(h('div',{class:'empty-state'},'No data'));
    }
    [dFrom,dTo,cityF,spF,typeF,statusF].forEach(el=>el.addEventListener('input', draw));
    setTimeout(draw, 0);
  }

  switchFuTab('today');
};

function completeAction(f){

function openOpportunityModal(id, customerId){
  const existing = id ? DB.byId('opportunities', id) : null;
  const custOpts = customerOptions();
  openModal(existing?'Edit Opportunity':'Add Opportunity', [
    {key:'customerId', label:'Customer', type:'select', options:custOpts, value: existing?existing.customerId:(customerId||'')},
    {key:'product', label:'Product', type:'select', options:productNames(), value:existing?existing.product:''},
    {key:'thickness', label:'Thickness', value:existing?existing.thickness:''},
    {key:'size', label:'Size', value:existing?existing.size:''},
    {key:'quantity', label:'Quantity', value:existing?existing.quantity:''},
    {key:'estValue', label:'Estimated Order Value (₹)', type:'number', value:existing?existing.estValue:''},
    {key:'expectedClosingDate', label:'Expected Closing Date', type:'date', value:existing?existing.expectedClosingDate:''},
    {key:'salesperson', label:'Salesperson', type:'select', options:salespersonNames(), value:existing?existing.salesperson:''},
    {key:'stage', label:'Stage', type:'select', options:OPP_STAGES, value:existing?existing.stage:'Qualification'},
    {key:'probability', label:'Probability (%)', type:'number', value:existing?existing.probability:'25'},
    {key:'competitor', label:'Competitor', value:existing?existing.competitor:''},
    {key:'currentSupplier', label:'Current Supplier', value:existing?existing.currentSupplier:''},
    {key:'notes', label:'Notes', full:true, type:'textarea', value:existing?existing.notes:''},
  ], (data)=>{
    if(!data.customerId || !data.product){ toast('Customer and Product are required'); return false; }
    if(!existing){
      const rec = Object.assign({id:uid(), createdAt: todayISO()}, data);
      DB.add('opportunities', rec); logAudit('Opportunity created','opportunity',rec.id,'',rec.product); toast('Opportunity added');
    } else {
      DB.update('opportunities', id, data); logAudit('Opportunity updated','opportunity',id,'',''); toast('Opportunity updated');
    }
    render();
  });
}

function markOpportunityWon(o){
  const cu = DB.byId('customers', o.customerId);
  openModal('Mark Order Won — ' + o.product, [
    {key:'rate', label:'Rate', type:'number'},
    {key:'orderValue', label:'Order Value (₹)', type:'number', value:o.estValue},
    {key:'dispatchDate', label:'Expected Dispatch Date', type:'date'},
    {key:'reason', label:'Reason for Conversion', full:true, type:'textarea'},
    {key:'remarks', label:'Remarks', full:true, type:'textarea'},
  ], (data)=>{
    const leadDays = cu && cu.firstContactDate ? daysBetween(cu.firstContactDate, todayISO()) : '';
    const rec = Object.assign({id: nextId('ORD'), opportunityId:o.id, customerId:o.customerId, orderDate: todayISO(),
      product:o.product, quantity:o.quantity, salesperson:o.salesperson, source: cu?cu.leadSource:'', leadToOrderDays: leadDays}, data);
    DB.add('ordersWon', rec);
    DB.update('opportunities', o.id, {stage:'Order Won'});
    logAudit('Order Won','opportunity',o.id,'', fmtMoney(data.orderValue));
    toast('🎉 Order marked WON'); render();
  });
}
function markOpportunityLost(o){
  openModal('Mark Order Lost — ' + o.product, [
    {key:'competitor', label:'Competitor', value:o.competitor||''},
    {key:'competitorPrice', label:'Competitor Price', type:'number'},
    {key:'ourPrice', label:'Our Quoted Price', type:'number'},

    {key:'remarks', label:'Detailed Remarks', full:true, type:'textarea'},
    {key:'reactivationDate', label:'Next Potential Reactivation Date', type:'date'},
  ], (data)=>{
    const rec = Object.assign({id:uid(), opportunityId:o.id, customerId:o.customerId, product:o.product, quantity:o.quantity,
      estValue:o.estValue, salesperson:o.salesperson, lostDate: todayISO()}, data);
    DB.add('ordersLost', rec);
    DB.update('opportunities', o.id, {stage:'Order Lost'});

function openQuotationModal(id){
  const existing = id ? DB.byId('quotations', id) : null;
  openModal(existing?'Edit Quotation':'New Quotation', [
    {key:'customerId', label:'Customer', type:'select', options:customerOptions(), value:existing?existing.customerId:''},
    {key:'opportunityId', label:'Opportunity', type:'select', options: DB.get('opportunities').map(o=>({value:o.id,label:o.product+' — '+fmtMoney(o.estValue)})), value:existing?existing.opportunityId:''},
    {key:'product', label:'Product', type:'select', options:productNames(), value:existing?existing.product:''},
    {key:'quantity', label:'Quantity', value:existing?existing.quantity:''},
    {key:'rate', label:'Rate (₹)', type:'number', value:existing?existing.rate:''},
    {key:'gst', label:'GST %', type:'number', value:existing?existing.gst:'18'},
    {key:'date', label:'Quotation Date', type:'date', value:existing?existing.date:todayISO()},
    {key:'validity', label:'Valid Until', type:'date', value:existing?existing.validity:''},
    {key:'salesperson', label:'Salesperson', type:'select', options:salespersonNames(), value:existing?existing.salesperson:''},
    {key:'status', label:'Status', type:'select', options:QUOTE_STATUSES, value:existing?existing.status:'Draft'},
  ], (data)=>{
    if(!data.customerId || !data.product){ toast('Customer and product required'); return false; }
    const rate = Number(data.rate)||0, qty = Number(data.quantity)||0, gstP = Number(data.gst)||0;
    const total = rate*qty; const finalVal = total + (total*gstP/100);
    data.totalValue = total.toFixed(2); data.finalValue = finalVal.toFixed(2);
    if(!existing){
      const rec = Object.assign({id: nextId('QT')}, data);
      DB.add('quotations', rec); logAudit('Quotation created','quotation',rec.id,'',rec.id); toast('Quotation created: '+rec.id);
    } else {
      DB.update('quotations', id, data); logAudit('Quotation updated','quotation',id,'',''); toast('Quotation updated');
    }
    render();
  });
}

RENDERERS.campaigns = function(c){
  pageHead(c, 'Marketing Sources & Campaigns', 'Which marketing activity actually generates business', [
    h('button',{class:'btn btn-red', onClick:()=>openCampaignModal(null)}, '＋ Add Campaign'),
  ]);

  const srcCard = h('div',{class:'card'});
  srcCard.appendChild(h('div',{class:'card-title'},'Source → Leads → Qualified → Quotations → Won → Lost → Revenue'));
  const srcCont = h('div'); srcCard.appendChild(srcCont);
  const leads = DB.get('leads'), opps = DB.get('opportunities'), quotes = DB.get('quotations'), won = DB.get('ordersWon'), lost = DB.get('ordersLost'), custs = DB.get('customers');
  const srcRows = sourceNames().map(s=>{
    const sLeads = leads.filter(l=>l.source===s);
    const sCustIds = custs.filter(cu=>cu.leadSource===s).map(cu=>cu.id);
    const qualified = sLeads.filter(l=>['Qualified','Product Discussion','Sample Required','Sample Sent','Follow-Up','Quotation','Negotiation','Order Won'].includes(l.status)).length;
    const sQuotes = quotes.filter(q=>sCustIds.includes(q.customerId)).length;
    const sWon = won.filter(o=>sCustIds.includes(o.customerId));
    const sLost = lost.filter(o=>sCustIds.includes(o.customerId)).length;
    const revenue = sWon.reduce((sum,o)=>sum+(Number(o.orderValue)||0),0);
    return {name:s, leads:sLeads.length, qualified, quotes:sQuotes, won:sWon.length, lost:sLost, revenue};
  }).filter(r=>r.leads>0 || r.won>0);
  renderTable(srcCont, [
    {label:'Source', key:'name'},{label:'Leads', key:'leads'},{label:'Qualified', key:'qualified'},
    {label:'Quotations', key:'quotes'},{label:'Won', key:'won'},{label:'Lost', key:'lost'},{label:'Revenue', render:r=>fmtMoney(r.revenue)}
  ], srcRows, {emptyText:'No source activity recorded yet.'});
  c.appendChild(srcCard);

  const campCard = h('div',{class:'card'});
  campCard.appendChild(h('div',{class:'card-title'},'Campaigns'));
  const campCont = h('div'); campCard.appendChild(campCont);
  const campRows = DB.get('campaigns').map(cp=>{
    const cLeads = leads.filter(l=>l.campaign===cp.name);
    const cost = Number(cp.budget)||0;
    return Object.assign({}, cp, {leadsGenerated:cLeads.length, costPerLead: cLeads.length?(cost/cLeads.length).toFixed(0):'—'});
  });
  renderTable(campCont, [
    {label:'Campaign', key:'name'}, {label:'Platform', key:'platform'}, {label:'Start', render:r=>toDisp(r.startDate)}, {label:'End', render:r=>toDisp(r.endDate)},
    {label:'Budget', render:r=>fmtMoney(r.budget)}, {label:'Leads', key:'leadsGenerated'}, {label:'Cost/Lead', render:r=>'₹'+r.costPerLead},
    {label:'', render:r=>h('button',{class:'btn btn-outline btn-xs', onClick:()=>openCampaignModal(r.id)},'Edit')}
  ], campRows, {emptyText:'No campaigns yet.'});
  c.appendChild(campCard);
};

  function sw(id){
    $all('.tab-btn', tabs).forEach((b,i)=>b.classList.toggle('active', defs[i].id===id));
    clear(panes);
    if(id==='lr') genericMasterPage(panes, {key:'lostReasons', title:'Lost Reason', sub:'Reasons offered when marking an opportunity lost',
      columns:[{label:'Reason', key:'name'}], fields:[{key:'name', label:'Reason', required:true}]});
    if(id==='src') genericMasterPage(panes, {key:'sources', title:'Marketing Source', sub:'Where leads come from',
      columns:[{label:'Source', key:'name'}], fields:[{key:'name', label:'Source Name', required:true}]});
    if(id==='score'){
      panes.appendChild(h('div',{class:'card'}, h('div',{class:'card-title'},'Lead Score Weights (illustrative — Hot ≥ 70, Warm 40-69, Cold < 40)'),
        h('p',{style:{fontSize:'12.5px',color:'var(--g5)',lineHeight:'1.7'}},
          'Factors: Customer Type, Estimated Requirement, Product Interest match, Purchase Timeline, Budget fit, Decision-maker contact, Existing relationship, Previous purchase, Engagement level. ',
          'Priority (Hot/Warm/Cold) is set manually today on each Customer/Lead record via the Priority field — assign it based on these factors during qualification.')));
    }
    if(id==='audit'){
      const rows = DB.get('audit').slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,200);
      renderTable(panes, [{label:'Date',render:r=>toDisp(r.date)},{label:'Time',key:'time'},{label:'User',key:'user'},
        {label:'Action',key:'action'},{label:'Entity',key:'entity'},{label:'Old',key:'oldValue'},{label:'New',key:'newValue'}], rows, {emptyText:'No activity logged yet.'});
    }
  }
  sw('lr');
};

/* ============================================================
   REPORTS & ANALYTICS
============================================================ */
RENDERERS.reports = function(c){
  pageHead(c, 'Reports & Analytics', 'Pipeline, conversion, ageing and product/city breakdowns', [
    h('button',{class:'btn btn-gray', onClick:()=>exportExcel('leads_export.xlsx', DB.get('leads'))}, '⬇ Export Leads'),
    h('button',{class:'btn btn-gray', onClick:()=>exportExcel('opportunities_export.xlsx', DB.get('opportunities'))}, '⬇ Export Opportunities'),
  ]);
  const leads = DB.get('leads'), opps = DB.get('opportunities'), won = DB.get('ordersWon'), lost = DB.get('ordersLost'), custs = DB.get('customers');

  // ---- Follow-Up Report: city / salesperson / date-range ----
  const fuCard = h('div',{class:'card'});
  fuCard.appendChild(h('div',{class:'card-title'}, 'Follow-Up Report', h('button',{class:'btn btn-gray btn-xs', onClick:()=>exportExcel('followup_report.xlsx', fuFiltered().map(fuExportRow))}, '⬇ Export')));
  const fuToolbar = h('div',{class:'toolbar'});
  const fuCityF = h('select'); fuCityF.appendChild(h('option',{value:''},'All Cities'));
  Array.from(new Set(custs.map(cu=>cu.city).filter(Boolean))).sort().forEach(ct=>fuCityF.appendChild(h('option',{value:ct},ct)));
  const fuSpF = h('select'); fuSpF.appendChild(h('option',{value:''},'All Salespersons'));
  salespersonNames().forEach(s=>fuSpF.appendChild(h('option',{value:s},s)));
  const fuStatusF = h('select'); fuStatusF.appendChild(h('option',{value:''},'All Statuses'));
  FOLLOWUP_STATUSES.forEach(s=>fuStatusF.appendChild(h('option',{value:s},s)));
  const fuFrom = h('input',{type:'date'}); const fuTo = h('input',{type:'date'});
  fuToolbar.appendChild(h('div',{class:'fld',style:{minWidth:'0'}}, h('label',{},'From'), fuFrom));
  fuToolbar.appendChild(h('div',{class:'fld',style:{minWidth:'0'}}, h('label',{},'To'), fuTo));
  fuToolbar.appendChild(fuCityF); fuToolbar.appendChild(fuSpF); fuToolbar.appendChild(fuStatusF);
  fuCard.appendChild(fuToolbar);
  const fuCont = h('div'); fuCard.appendChild(fuCont);

  function fuFiltered(){
    let rows = DB.get('followups');
    if(fuFrom.value) rows = rows.filter(f=>(f.date||'') >= fuFrom.value);
    if(fuTo.value) rows = rows.filter(f=>(f.date||'') <= fuTo.value);
    if(fuCityF.value) rows = rows.filter(f=>{ const cu=DB.byId('customers',f.customerId); return cu && cu.city===fuCityF.value; });
    if(fuSpF.value) rows = rows.filter(f=>f.salesperson===fuSpF.value);
    if(fuStatusF.value) rows = rows.filter(f=>f.status===fuStatusF.value);
    return rows.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  }
  function fuExportRow(f){
    const cu = DB.byId('customers', f.customerId) || {};
    return {Date:toDisp(f.date), Customer:cu.companyName||'', City:cu.city||'', Salesperson:f.salesperson, Type:f.type,
      Discussion:f.discussion, NextAction:f.nextAction, NextFollowUp:toDisp(f.nextFollowUpDate), Status:f.status};
  }
  function drawFuReport(){
    const rows = fuFiltered();
    renderTable(fuCont, [
      {label:'Date', render:r=>toDisp(r.date)},
      {label:'Customer', render:r=>{const cu=DB.byId('customers',r.customerId); return cu?cu.companyName:'—';}},
      {label:'City', render:r=>{const cu=DB.byId('customers',r.customerId); return cu?cu.city:'—';}},
      {label:'Salesperson', key:'salesperson'}, {label:'Type', key:'type'}, {label:'Discussion', key:'discussion'},
      {label:'Next Action', key:'nextAction'}, {label:'Next Follow-up', render:r=>toDisp(r.nextFollowUpDate)},
      {label:'Status', render:r=>statusTag(r.status)},
    ], rows, {emptyText:'No follow-ups match this filter.'});
  }
  [fuFrom,fuTo,fuCityF,fuSpF,fuStatusF].forEach(el=>el.addEventListener('input', drawFuReport));
  drawFuReport();
  c.appendChild(fuCard);

  const g2 = h('div',{class:'grid2'});
  const left = h('div');
  const c1 = h('div',{class:'card'}); c1.appendChild(h('div',{class:'card-title'},'Product-wise Enquiries'));
  const b1 = h('div',{class:'chart-box'}); c1.appendChild(b1); left.appendChild(c1);
  const c2 = h('div',{class:'card'}); c2.appendChild(h('div',{class:'card-title'},'City-wise Leads'));
  const b2 = h('div',{class:'chart-box'}); c2.appendChild(b2); left.appendChild(c2);
  const c3 = h('div',{class:'card'}); c3.appendChild(h('div',{class:'card-title'},'Salesperson Performance (Won vs Lost)'));
  const b3 = h('div',{class:'chart-box'}); c3.appendChild(b3); left.appendChild(c3);
  g2.appendChild(left);

  const right = h('div');
  const c4 = h('div',{class:'card'}); c4.appendChild(h('div',{class:'card-title'},'Lead Ageing (open leads)'));
  const b4 = h('div',{class:'chart-box sm'}); c4.appendChild(b4); right.appendChild(c4);
  const c5 = h('div',{class:'card'}); c5.appendChild(h('div',{class:'card-title'},'Competitor Analysis (Lost Orders)'));
  const b5 = h('div',{class:'chart-box sm'}); c5.appendChild(b5); right.appendChild(c5);
  const c6 = h('div',{class:'card'}); c6.appendChild(h('div',{class:'card-title'},'Dormant Customers'));
  const dormCont = h('div'); c6.appendChild(dormCont); right.appendChild(c6);
  g2.appendChild(right);
  c.appendChild(g2);

  const dormant = custs.filter(cu=> cu.lastContactDate && daysBetween(cu.lastContactDate, todayISO())>=30)
    .map(cu=>Object.assign({}, cu, {daysSince: daysBetween(cu.lastContactDate, todayISO())}));
  renderTable(dormCont, [{label:'Customer',key:'companyName'},{label:'Salesperson',key:'salesperson'},{label:'Days Since Contact',key:'daysSince'}],
    dormant.sort((a,b)=>b.daysSince-a.daysSince).slice(0,10), {emptyText:'No dormant customers 🎉'});

  setTimeout(()=>{
    const prodAgg={}; leads.forEach(l=>{ const p=l.productInterested||'Other'; prodAgg[p]=(prodAgg[p]||0)+1; });
    const pl=Object.keys(prodAgg);
    if(pl.length) new Chart(mkCanvas(b1), {type:'bar', data:{labels:pl, datasets:[{label:'Enquiries', data:pl.map(k=>prodAgg[k]), backgroundColor:'#C8102E'}]}, options:baseChartOpts({})});
    else b1.appendChild(h('div',{class:'empty-state'},'No data'));

    const cityAgg={}; leads.forEach(l=>{ const ct=l.city||'Unknown'; cityAgg[ct]=(cityAgg[ct]||0)+1; });
    const cl=Object.keys(cityAgg).sort((a,b)=>cityAgg[b]-cityAgg[a]).slice(0,10);
    if(cl.length) new Chart(mkCanvas(b2), {type:'bar', data:{labels:cl, datasets:[{label:'Leads', data:cl.map(k=>cityAgg[k]), backgroundColor:'#0891b2'}]}, options:baseChartOpts({indexAxis:'y'})});
    else b2.appendChild(h('div',{class:'empty-state'},'No data'));

    const spNames = salespersonNames();
    if(spNames.length){
      new Chart(mkCanvas(b3), {type:'bar', data:{labels:spNames, datasets:[
        {label:'Won', data:spNames.map(n=>won.filter(o=>o.salesperson===n).length), backgroundColor:'#16a34a'},
        {label:'Lost', data:spNames.map(n=>lost.filter(o=>o.salesperson===n).length), backgroundColor:'#dc2626'}
      ]}, options:Object.assign({maintainAspectRatio:false},{plugins:{legend:{position:'bottom'}}})});
    } else b3.appendChild(h('div',{class:'empty-state'},'No salespersons'));

    const openLeads = leads.filter(l=>!['Order Won','Order Lost'].includes(l.status));
    const buckets = {'0-7':0,'8-15':0,'16-30':0,'31-60':0,'61-90':0,'90+':0};
    openLeads.forEach(l=>{ const d = daysBetween(l.dateAdded, todayISO());
      if(d<=7) buckets['0-7']++; else if(d<=15) buckets['8-15']++; else if(d<=30) buckets['16-30']++;
      else if(d<=60) buckets['31-60']++; else if(d<=90) buckets['61-90']++; else buckets['90+']++; });
    new Chart(mkCanvas(b4), {type:'doughnut', data:{labels:Object.keys(buckets), datasets:[{data:Object.values(buckets),
      backgroundColor:['#16a34a','#0891b2','#d97706','#7c3aed','#C8102E','#4a5568']}]}, options:{maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:9,font:{size:9}}}}}});

    const compAgg={}; lost.forEach(l=>{ const cn=l.competitor||'Unknown'; compAgg[cn]=(compAgg[cn]||0)+1; });
    const cml = Object.keys(compAgg);
    if(cml.length) new Chart(mkCanvas(b5), {type:'pie', data:{labels:cml, datasets:[{data:cml.map(k=>compAgg[k]),
      backgroundColor:['#C8102E','#0891b2','#7c3aed','#d97706','#4a5568','#16a34a']}]}, options:{maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:9,font:{size:9}}}}}});
    else b5.appendChild(h('div',{class:'empty-state'},'No lost orders yet'));
  }, 0);
};

/* ============================================================
   GLOBAL SEARCH
============================================================ */
function globalSearch(q){
  q = q.toLowerCase().trim();
  const results = [];
  if(!q) return results;
  DB.get('customers').forEach(cu=>{
    if((cu.companyName+cu.mobile+cu.city+cu.state+(cu.contactPerson||'')+(cu.gst||'')).toLowerCase().includes(q))
      results.push({tag:'Customer', label:cu.companyName+' — '+(cu.city||''), action:()=>{CUSTOMER_VIEW_ID=cu.id; navigate('customers');}});
  });
  DB.get('leads').forEach(l=>{
    if((l.companyName+l.mobile+l.city).toLowerCase().includes(q))
      results.push({tag:'Lead', label:l.companyName+' — '+(l.status||''), action:()=>navigate('rawleads')});
  });
  DB.get('opportunities').forEach(o=>{
    if((o.product||'').toLowerCase().includes(q))
      results.push({tag:'Opportunity', label:o.product, action:()=>navigate('opportunities')});
  });
  DB.get('quotations').forEach(qq=>{
    if(qq.id.toLowerCase().includes(q) || (qq.product||'').toLowerCase().includes(q))
      results.push({tag:'Quotation', label:qq.id, action:()=>navigate('quotations')});
  });
  salespersonNames().forEach(n=>{
    if(n.toLowerCase().includes(q)) results.push({tag:'Salesperson', label:n, action:()=>navigate('salespersons')});
  });
  return results.slice(0,15);
}
$('#gsearch-input').addEventListener('input', (e)=>{
  const box = $('#gsearch-results');
  const results = globalSearch(e.target.value);
  clear(box);
  if(!results.length){ box.style.display='none'; return; }
  results.forEach(r=> box.appendChild(h('div',{class:'gr-item', onClick:()=>{ r.action(); box.style.display='none'; e.target.value=''; }},
    h('span',{class:'gr-tag'}, r.tag), r.label)));
  box.style.display='block';
});
document.addEventListener('click', (e)=>{ if(!$('#gsearch').contains(e.target)) $('#gsearch-results').style.display='none'; });

$('#notif-btn').addEventListener('click', ()=>{
  const b = followupBuckets();
  const body = h('div');
  const items = [
    ...b.overdue.map(f=>({icon:'🔴', text:'Overdue: '+(DB.byId('customers',f.customerId)||{}).companyName}) ),
    ...b.today.map(f=>({icon:'🟢', text:'Today: '+(DB.byId('customers',f.customerId)||{}).companyName}) ),

  const lostReact = DB.get('ordersLost').filter(l=>l.reactivationDate===todayISO());
  lostReact.forEach(l=> items.push({icon:'🟢', text:'Reactivate today: '+(DB.byId('customers',l.customerId)||{}).companyName}));
  if(!items.length) body.appendChild(h('p',{},'No pending notifications.'));
  items.slice(0,20).forEach(it=> body.appendChild(h('div',{style:{padding:'8px 0',borderBottom:'1px solid var(--g1)',fontSize:'12.5px'}}, it.icon+' '+it.text)));
  openModal('Notifications', [], null, {custom: body}, [{label:'Close', cls:'btn-red', action:closeModal}]);
});
